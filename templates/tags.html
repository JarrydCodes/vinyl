<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NFC tag addresses</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tags-table{width:100%;min-width:1080px;border-collapse:collapse}
.tags-table th,.tags-table td{padding:10px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
.tags-table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--paper)}
.tags-table tbody tr:nth-child(even){background:rgba(127,127,127,.07)}
.tags-table tbody tr:last-child td{border-bottom:0}
.tags-table .thumb{width:44px;height:44px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.tags-table .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tags-table td.c-img,.tags-table th.c-img{width:70px;padding-right:0}
.tags-table td.c-title{font-weight:600}
.tags-table code{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--muted)}
.tags-table td.c-tick,.tags-table th.c-tick{text-align:center;width:90px}
.tags-table .c-tick input{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}
.tags-table td.c-copy{width:110px;text-align:right}
.tags-table .btn.copy{display:inline-flex;padding:7px 16px;min-width:84px}
.tags-table td small{display:block;color:var(--muted);line-height:1.3}
.tags-table td.c-press b{display:block;line-height:1.3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head><body>
<div class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">&larr; Collection</a><i aria-hidden="true">&rsaquo;</i><span aria-current="page">NFC tags</span></nav>
  <div class="top"><div><h1>NFC tag addresses</h1><div class="count" id="progress"></div></div></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search artist, title, label, colour" aria-label="Search">
    <select id="show" aria-label="Filter">
      <option value="all">All records</option><option value="todo">Not written yet</option><option value="done">Written</option>
    </select>
  </div>
  <div class="tablewrap"><table class="tags-table">
    <thead><tr><th class="c-img"><span class="sr">Cover</span></th><th>Title</th><th>Artist</th><th>Year</th><th>Label</th><th>Pressing</th><th>Address</th><th class="c-tick">Written</th><th class="c-copy"><span class="sr">Copy</span></th></tr></thead>
    <tbody id="list"></tbody></table></div>
  <p class="empty" id="empty" hidden>Nothing matches.</p>
</div>
<script src="collection.js"></script>
<script>
const data = (window.COLLECTION || []).slice().sort((a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title) || (a.year || 0) - (b.year || 0) || (a.catno || "").localeCompare(b.catno || ""));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const urlFor = r => new URL("record.html?id=" + r.id, location.href).href;
// "Written" ticks are kept in this browser only
let done = {};
try { done = JSON.parse(localStorage.getItem("tagsWritten") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("tagsWritten", JSON.stringify(done)); } catch (e) {} };

function render() {
  const q = $("q").value.trim().toLowerCase(), show = $("show").value;
  const list = data.filter(r => (!q || [r.artist, r.title, r.label, r.catno, r.colour, r.format, r.country, r.year].join(" ").toLowerCase().includes(q)) &&
    (show === "all" || (show === "done") === !!done[r.id]));
  $("progress").textContent = data.filter(r => done[r.id]).length + " of " + data.length + " tags written";
  $("empty").hidden = list.length > 0;
  $("list").innerHTML = list.map(r => `<tr>
    <td class="c-img"><div class="thumb">${r.cover ? `<img src="${esc(r.cover)}" alt="" loading="lazy">` : ""}</div></td>
    <td class="c-title">${esc(r.title)}</td><td>${esc(r.artist)}</td>
    <td>${esc(r.year || "")}</td>
    <td>${esc(r.label)}${r.catno ? `<small>${esc(r.catno)}</small>` : ""}</td>
    <td class="c-press">${r.colour ? `<b>${esc(r.colour)}</b>` : ""}<small>${esc([r.format, r.country].filter(Boolean).join(" \u00b7 "))}</small></td>
    <td><code title="${esc(urlFor(r))}">${esc(urlFor(r))}</code></td>
    <td class="c-tick"><input type="checkbox" data-id="${r.id}" aria-label="Tag written for ${esc(r.title)}" ${done[r.id] ? "checked" : ""}></td>
    <td class="c-copy"><button class="btn copy" data-id="${r.id}" type="button">Copy</button></td></tr>`).join("");
}
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button.copy"); if (!b) return;
  const r = data.find(x => String(x.id) === b.dataset.id), text = urlFor(r);
  try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
  catch (err) { window.prompt("Copy this address:", text); }
  setTimeout(() => b.textContent = "Copy", 1500);
});
$("list").addEventListener("change", e => {
  const c = e.target.closest("input[type=checkbox]"); if (!c) return;
  if (c.checked) done[c.dataset.id] = 1; else delete done[c.dataset.id];
  save();
  if ($("show").value === "all") $("progress").textContent = data.filter(r => done[r.id]).length + " of " + data.length + " tags written";
  else render();
});
$("q").oninput = render; $("show").onchange = render; render();
</script>
</body></html>
